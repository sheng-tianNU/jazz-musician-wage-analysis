name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-phases:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # Phases read the small cached extracts in data/, so a fresh clone runs end to end.
      - run: |
          for p in 1 2 3 4; do
            python notebooks/phase${p}_*.py
          done
